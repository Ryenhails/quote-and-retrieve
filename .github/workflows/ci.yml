name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The scoring path has no heavy dependencies, so CI stays fast and
      # does not download models or documents.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run scoring tests
        run: python -m pytest tests/ -q

      - name: Score the worked examples end to end
        run: |
          python src/score_citevqa.py examples/sample_predictions.jsonl
          python src/score_citevqa.py examples/sample_predictions_coordinate.jsonl
